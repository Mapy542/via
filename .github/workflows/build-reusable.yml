name: Reusable Build

on:
    workflow_call:
        inputs:
            build_type:
                description: 'CMake build type (Debug or Release)'
                required: false
                type: string
                default: 'Release'
            build_tests:
                description: 'Whether to build tests'
                required: false
                type: boolean
                default: false
            build_parallelism:
                description: 'Maximum build parallelism, or 0 to let CMake choose'
                required: false
                type: string
                default: '0'
            run_tests:
                description: 'Whether to run tests after the build completes'
                required: false
                type: boolean
                default: false
            artifact_name:
                description: 'Name for the uploaded build artifact'
                required: false
                type: string
                default: 'via-build'
            upload_artifact:
                description: 'Whether to upload the build directory as an artifact'
                required: false
                type: boolean
                default: true
            cmake_install_prefix:
                description: 'CMAKE_INSTALL_PREFIX value'
                required: false
                type: string
                default: ''
            version_override:
                description: 'Optional Via version override passed to CMake'
                required: false
                type: string
                default: ''
            runner:
                description: 'GitHub Actions runner label'
                required: false
                type: string
                default: 'ubuntu-latest'
            qt_host:
                description: 'Qt host for install-qt-action (linux for x86_64, linux_arm64 for ARM64)'
                required: false
                type: string
                default: 'linux'
            qt_arch:
                description: 'Qt architecture for install-qt-action (e.g. linux_gcc_arm64 for ARM64; empty for x86_64)'
                required: false
                type: string
                default: ''

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    QT_VERSION: '6.7.3'
    QT_MODULES: 'qtnetworkauth'
    QT_INSTALL_DIR: ${{ github.workspace }}/.qt

jobs:
    build:
        runs-on: ${{ inputs.runner }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    build-essential \
                    cmake \
                    ninja-build \
                    pkg-config \
                    libfuse3-dev \
                    libsecret-1-dev \
                    libdbus-1-dev \
                                        libgl1-mesa-dev \
                                        qtkeychain-qt6-dev

            - name: Install Qt
              uses: jurplel/install-qt-action@v4
              with:
                  version: ${{ env.QT_VERSION }}
                  modules: ${{ env.QT_MODULES }}
                  host: ${{ inputs.qt_host }}
                  arch: ${{ inputs.qt_arch }}
                  dir: ${{ env.QT_INSTALL_DIR }}
                  cache: 'true'
                  cache-key-prefix: "${{ format('qt-{0}-{1}-{2}-{3}', env.QT_VERSION, inputs.qt_host, inputs.qt_arch != '' && inputs.qt_arch || 'default', env.QT_MODULES) }}"
                  install-deps: 'false'

            - name: Log Qt install details
              run: |
                  echo "Qt cache prefix: ${{ format('qt-{0}-{1}-{2}-{3}', env.QT_VERSION, inputs.qt_host, inputs.qt_arch != '' && inputs.qt_arch || 'default', env.QT_MODULES) }}"
                  echo "Qt install dir: ${{ env.QT_INSTALL_DIR }}"
                  echo "QT_ROOT_DIR=$QT_ROOT_DIR"
                  du -sh "${{ env.QT_INSTALL_DIR }}" || true

            - name: Configure CMake
              run: |
                  set -euo pipefail
                  cmake_args=(
                    -G Ninja
                    -B build
                    -DCMAKE_BUILD_TYPE=${{ inputs.build_type }}
                    -DBUILD_TESTS=${{ inputs.build_tests && 'ON' || 'OFF' }}
                  )

                  if [ -n "${{ inputs.cmake_install_prefix }}" ]; then
                      cmake_args+=("-DCMAKE_INSTALL_PREFIX=${{ inputs.cmake_install_prefix }}")
                  fi

                  if [ -n "${{ inputs.version_override }}" ]; then
                      cmake_args+=("-DVIA_VERSION_OVERRIDE=${{ inputs.version_override }}")
                  fi

                  cmake "${cmake_args[@]}"

            - name: Build
              run: |
                  if [ "${{ inputs.build_parallelism }}" = '0' ]; then
                      cmake --build build --parallel
                  else
                      cmake --build build --parallel ${{ inputs.build_parallelism }}
                  fi

            - name: Run tests
              if: ${{ inputs.run_tests }}
              run: ctest --test-dir build --output-on-failure

            - name: Upload build directory
              if: ${{ inputs.upload_artifact }}
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ inputs.artifact_name }}
                  path: build/
                  retention-days: 7
