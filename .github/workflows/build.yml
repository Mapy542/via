name: Build and Test

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    build:
        strategy:
            matrix:
                include:
                    - arch: x86_64
                      runner: ubuntu-latest
                      qt_host: linux
                      qt_arch: ''
                      artifact_name: via-build-x86_64
                    - arch: aarch64
                      runner: ubuntu-24.04-arm
                      qt_host: linux_arm64
                      qt_arch: linux_gcc_arm64
                      artifact_name: via-build-aarch64
        uses: ./.github/workflows/build-reusable.yml
        with:
            build_type: Release
            build_tests: true
            run_tests: true
            artifact_name: ${{ matrix.artifact_name }}
            upload_artifact: false
            runner: ${{ matrix.runner }}
            qt_host: ${{ matrix.qt_host }}
            qt_arch: ${{ matrix.qt_arch }}
