name: Release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            version:
                description: 'Release version label (e.g. v0.1.0)'
                required: true
                type: string

env:
    RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
    contents: write # Required for creating releases

jobs:
    build:
        strategy:
            matrix:
                include:
                    - arch: x86_64
                      runner: ubuntu-latest
                      qt_arch: ''
                      artifact_name: via-release-build-x86_64
                    - arch: aarch64
                      runner: ubuntu-24.04-arm
                      qt_arch: gcc_arm64
                      artifact_name: via-release-build-aarch64
        uses: ./.github/workflows/build-reusable.yml
        with:
            build_type: Release
            build_tests: false
            artifact_name: ${{ matrix.artifact_name }}
            cmake_install_prefix: /usr
            runner: ${{ matrix.runner }}
            qt_arch: ${{ matrix.qt_arch }}

    package:
        needs: build
        strategy:
            matrix:
                include:
                    - arch: x86_64
                      runner: ubuntu-latest
                      artifact_name: via-release-build-x86_64
                      qt_arch: ''
                      linuxdeploy_arch: x86_64
                    - arch: aarch64
                      runner: ubuntu-24.04-arm
                      artifact_name: via-release-build-aarch64
                      qt_arch: gcc_arm64
                      linuxdeploy_arch: aarch64
        runs-on: ${{ matrix.runner }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libfuse3-dev \
                    libsecret-1-dev \
                    libdbus-1-dev \
                    libgl1-mesa-dev \
                    fuse3 \
                    file \
                    desktop-file-utils \
                    cmake

            - name: Install Qt
              uses: jurplel/install-qt-action@v4
              with:
                  version: '6.7.3'
                  modules: 'qtnetworkauth'
                  host: linux
                  arch: ${{ matrix.qt_arch }}

            - name: Install Qt6Keychain
              run: |
                  git clone https://github.com/frankosterfeld/qtkeychain.git --depth 1
                  cmake -B qtkeychain/build -S qtkeychain \
                    -DBUILD_WITH_QT6=ON \
                    -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
                    -DCMAKE_INSTALL_PREFIX=/usr
                  cmake --build qtkeychain/build --parallel
                  sudo cmake --install qtkeychain/build

            - name: Download build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: ${{ matrix.artifact_name }}
                  path: build/

            - name: Install linuxdeploy
              run: |
                  wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.linuxdeploy_arch }}.AppImage
                  wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${{ matrix.linuxdeploy_arch }}.AppImage
                  chmod +x linuxdeploy*.AppImage

            - name: Install to AppDir
              run: |
                  DESTDIR=AppDir cmake --install build
                  mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
                  cp res/icons/via.svg AppDir/usr/share/icons/hicolor/scalable/apps/via.svg
                  mkdir -p AppDir/usr/share/applications
                  cp res/via.desktop AppDir/usr/share/applications/

            - name: Remove unsupported Qt SQL drivers
              run: |
                  rm -f "$QT_ROOT_DIR/plugins/sqldrivers/libqsqlmimer.so"

            - name: Create AppImage
              run: |
                  export APPIMAGE_EXTRACT_AND_RUN=1
                  export QMAKE=$(which qmake6 2>/dev/null || which qmake)
                  export EXTRA_QT_PLUGINS="svg;"
                  ./linuxdeploy-${{ matrix.linuxdeploy_arch }}.AppImage --appdir AppDir --plugin qt --output appimage

            - name: Rename AppImage
              run: |
                  mv Via*.AppImage Via-${{ env.RELEASE_VERSION }}-${{ matrix.arch }}.AppImage

            - name: Create Release
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: ${{ env.RELEASE_VERSION }}
                  name: Via ${{ env.RELEASE_VERSION }}
                  files: Via-*.AppImage
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
