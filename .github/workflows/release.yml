name: Release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            version:
                description: 'Release tag or version (e.g. v0.1.0 or 0.1.0)'
                required: true
                type: string

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    QT_VERSION: '6.7.3'
    QT_MODULES: 'qtnetworkauth'
    QT_INSTALL_DIR: ${{ github.workspace }}/.qt

permissions:
    contents: write # Required for creating releases

jobs:
    validate:
        runs-on: ubuntu-latest
        outputs:
            release_tag: ${{ steps.version.outputs.release_tag }}
            resolved_version: ${{ steps.version.outputs.resolved_version }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Validate checked-in version against release ref
              id: version
              env:
                  RELEASE_REF: ${{ inputs.version || github.ref_name }}
              run: |
                  set -euo pipefail

                  if [[ -z "${RELEASE_REF}" ]]; then
                      echo "Release ref is empty" >&2
                      exit 1
                  fi

                  checked_in_version="$(tr -d '[:space:]' < VERSION)"
                  if [[ -z "${checked_in_version}" ]]; then
                      echo "VERSION is empty" >&2
                      exit 1
                  fi

                  release_version="${RELEASE_REF#v}"
                  if [[ "${release_version}" != "${checked_in_version}" ]]; then
                      echo "Release ref ${RELEASE_REF} does not match checked-in version ${checked_in_version}" >&2
                      exit 1
                  fi

                  printf 'release_tag=v%s\n' "${release_version}" >> "$GITHUB_OUTPUT"
                  printf 'resolved_version=%s\n' "${checked_in_version}" >> "$GITHUB_OUTPUT"

    build:
        needs: validate
        strategy:
            matrix:
                include:
                    - arch: x86_64
                      runner: ubuntu-latest
                      qt_host: linux
                      qt_arch: ''
                      build_parallelism: '0'
                      artifact_name: via-release-build-x86_64
                    - arch: aarch64
                      runner: ubuntu-24.04-arm
                      qt_host: linux_arm64
                      qt_arch: linux_gcc_arm64
                      build_parallelism: '2'
                      artifact_name: via-release-build-aarch64
        uses: ./.github/workflows/build-reusable.yml
        with:
            build_type: Release
            build_tests: false
            build_parallelism: ${{ matrix.build_parallelism }}
            artifact_name: ${{ matrix.artifact_name }}
            cmake_install_prefix: /usr
            runner: ${{ matrix.runner }}
            qt_host: ${{ matrix.qt_host }}
            qt_arch: ${{ matrix.qt_arch }}
            version_override: ${{ needs.validate.outputs.resolved_version }}

    package:
        needs:
            - validate
            - build
        strategy:
            matrix:
                include:
                    - arch: x86_64
                      runner: ubuntu-latest
                      artifact_name: via-release-build-x86_64
                      qt_host: linux
                      qt_arch: ''
                      linuxdeploy_arch: x86_64
                    - arch: aarch64
                      runner: ubuntu-24.04-arm
                      artifact_name: via-release-build-aarch64
                      qt_host: linux_arm64
                      qt_arch: linux_gcc_arm64
                      linuxdeploy_arch: aarch64
        runs-on: ${{ matrix.runner }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libfuse3-dev \
                    libsecret-1-dev \
                    libdbus-1-dev \
                    libgl1-mesa-dev \
                    libxkbcommon-x11-0 \
                    fuse3 \
                    file \
                    desktop-file-utils \
                    cmake \
                    qtkeychain-qt6-dev \
                    libxcb-cursor0

            - name: Install Qt
              uses: jurplel/install-qt-action@v4
              with:
                  version: ${{ env.QT_VERSION }}
                  modules: ${{ env.QT_MODULES }}
                  host: ${{ matrix.qt_host }}
                  arch: ${{ matrix.qt_arch }}
                  dir: ${{ env.QT_INSTALL_DIR }}
                  cache: 'true'
                  cache-key-prefix: "${{ format('qt-{0}-{1}-{2}-{3}', env.QT_VERSION, matrix.qt_host, matrix.qt_arch != '' && matrix.qt_arch || 'default', env.QT_MODULES) }}"

            - name: Log Qt install details
              run: |
                  echo "Qt cache prefix: ${{ format('qt-{0}-{1}-{2}-{3}', env.QT_VERSION, matrix.qt_host, matrix.qt_arch != '' && matrix.qt_arch || 'default', env.QT_MODULES) }}"
                  echo "Qt install dir: ${{ env.QT_INSTALL_DIR }}"
                  echo "QT_ROOT_DIR=$QT_ROOT_DIR"
                  du -sh "${{ env.QT_INSTALL_DIR }}" || true

            - name: Preflight Qt packaging prerequisites
              run: |
                  set -euo pipefail

                  resolve_qmake() {
                    if [ -n "${QMAKE:-}" ] && [ -x "${QMAKE}" ]; then
                      printf '%s\n' "${QMAKE}"
                      return 0
                    fi

                    for candidate in "${QT_ROOT_DIR:-}/bin/qmake6" "${QT_ROOT_DIR:-}/bin/qmake"; do
                      if [ -x "${candidate}" ]; then
                        printf '%s\n' "${candidate}"
                        return 0
                      fi
                    done

                    command -v qmake6 2>/dev/null || command -v qmake 2>/dev/null || true
                  }

                  print_dir() {
                    label="$1"
                    dir_path="$2"
                    echo "Qt plugin directory (${label}): ${dir_path}"
                    if [ ! -d "${dir_path}" ]; then
                      echo "  (missing)"
                      return 0
                    fi

                    find "${dir_path}" -maxdepth 1 -type f -printf '  %f\n' | sort
                  }

                  qmake_path="$(resolve_qmake)"
                  if [ -z "${qmake_path}" ]; then
                    echo "Cannot find qmake for AppImage packaging" >&2
                    exit 1
                  fi

                  plugin_root="$("${qmake_path}" -query QT_INSTALL_PLUGINS)"
                  if [ -z "${plugin_root}" ] || [ ! -d "${plugin_root}" ]; then
                    echo "qmake did not resolve a usable Qt plugin root" >&2
                    echo "Resolved QMAKE: ${qmake_path}" >&2
                    exit 1
                  fi

                  echo "Resolved QMAKE: ${qmake_path}"
                  echo "Qt plugin root: ${plugin_root}"
                  print_dir iconengines "${plugin_root}/iconengines"
                  print_dir imageformats "${plugin_root}/imageformats"
                  print_dir platforms "${plugin_root}/platforms"

                  printf 'QMAKE=%s\n' "${qmake_path}" >> "$GITHUB_ENV"
                  printf 'QT_PLUGIN_ROOT=%s\n' "${plugin_root}" >> "$GITHUB_ENV"

                  missing_plugin=false
                  for relative_path in \
                    iconengines/libqsvgicon.so \
                    imageformats/libqsvg.so \
                    platforms/libqxcb.so; do
                    if [ ! -f "${plugin_root}/${relative_path}" ]; then
                      echo "Missing required Qt plugin: ${plugin_root}/${relative_path}" >&2
                      missing_plugin=true
                    fi
                  done

                  if [ "${missing_plugin}" = true ]; then
                    echo "AppImage packaging requires QtSvg plugins and the XCB platform plugin in the active Qt tree." >&2
                    exit 1
                  fi

                  missing_xcb_deps="$(ldd "${plugin_root}/platforms/libqxcb.so" | awk '/not found/ { print $1 }')"
                  if [ -n "${missing_xcb_deps}" ]; then
                    echo "Qt platform plugin libqxcb.so has unresolved runtime dependencies:" >&2
                    printf '  - %s\n' ${missing_xcb_deps} >&2
                    echo "Install the matching XCB runtime libraries before packaging." >&2
                    exit 1
                  fi

            - name: Download build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: ${{ matrix.artifact_name }}
                  path: build/

            - name: Read resolved version
              id: version
              env:
                  EXPECTED_VERSION: ${{ needs.validate.outputs.resolved_version }}
              run: |
                  set -euo pipefail

                  resolved_version="$(tr -d '[:space:]' < build/via-version.txt)"
                  if [[ -z "${resolved_version}" ]]; then
                    echo "build/via-version.txt is empty" >&2
                    exit 1
                  fi

                  if [[ "${resolved_version}" != "${EXPECTED_VERSION}" ]]; then
                    echo "Build artifact version ${resolved_version} does not match validated version ${EXPECTED_VERSION}" >&2
                    exit 1
                  fi

                  printf 'resolved_version=%s\n' "${resolved_version}" >> "$GITHUB_OUTPUT"

            - name: Install linuxdeploy
              run: |
                  wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.linuxdeploy_arch }}.AppImage
                  wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${{ matrix.linuxdeploy_arch }}.AppImage
                  chmod +x linuxdeploy*.AppImage

            - name: Install to AppDir
              run: |
                  DESTDIR=AppDir cmake --install build
                  mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
                  cp res/icons/via.svg AppDir/usr/share/icons/hicolor/scalable/apps/via.svg
                  mkdir -p AppDir/usr/share/applications
                  cp res/via.desktop AppDir/usr/share/applications/

            - name: Keep only SQLite Qt SQL driver
              run: |
                  set -euo pipefail
                  sql_driver_dir="$QT_ROOT_DIR/plugins/sqldrivers"
                  if [ -d "$sql_driver_dir" ]; then
                      find "$sql_driver_dir" -maxdepth 1 -type f -name 'libqsql*.so' ! -name 'libqsqlite.so' -print -delete
                      ls -1 "$sql_driver_dir"
                  fi

            - name: Create AppImage
              run: |
                  export APPIMAGE_EXTRACT_AND_RUN=1
                  export EXTRA_QT_PLUGINS="svg;"
                  ./linuxdeploy-${{ matrix.linuxdeploy_arch }}.AppImage --appdir AppDir --plugin qt --output appimage

            - name: Rename AppImage
              run: |
                  mv Via*.AppImage Via-${{ steps.version.outputs.resolved_version }}-${{ matrix.arch }}.AppImage

            - name: Generate release notes
              run: |
                  bash ./scripts/generate-release-notes.sh github --version "${{ steps.version.outputs.resolved_version }}" > release-notes.md

            - name: Create Release
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: ${{ needs.validate.outputs.release_tag }}
                  name: Via ${{ steps.version.outputs.resolved_version }}
                  body_path: release-notes.md
                  files: Via-*.AppImage
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    package-deb:
        needs: validate
        strategy:
            matrix:
                include:
                    - arch: amd64
                      runner: ubuntu-latest
                    - arch: arm64
                      runner: ubuntu-24.04-arm
        runs-on: ${{ matrix.runner }}
        container:
            image: debian:stable

        steps:
            - name: Install Debian packaging dependencies
              env:
                  DEBIAN_FRONTEND: noninteractive
              run: |
                  set -euo pipefail
                  apt-get update
                  apt-get install -y --no-install-recommends \
                    build-essential \
                    ca-certificates \
                    cmake \
                    debhelper \
                    desktop-file-utils \
                    dpkg-dev \
                    git \
                    libfuse3-dev \
                    libgl1-mesa-dev \
                    libqt6sql6-sqlite \
                    lintian \
                    pkgconf \
                    qt6-base-dev \
                    qt6-networkauth-dev \
                    qtkeychain-qt6-dev

            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Build Debian package
              run: ./scripts/make-deb.sh

            - name: Verify Debian artifact name
              run: |
                  set -euo pipefail
                  test -f "build-deb/artifacts/via_${{ needs.validate.outputs.resolved_version }}-1_${{ matrix.arch }}.deb"

            - name: Generate release notes
              run: |
                  bash ./scripts/generate-release-notes.sh github --version "${{ needs.validate.outputs.resolved_version }}" > release-notes.md

            - name: Create Release
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: ${{ needs.validate.outputs.release_tag }}
                  name: Via ${{ needs.validate.outputs.resolved_version }}
                  body_path: release-notes.md
                  files: build-deb/artifacts/via_${{ needs.validate.outputs.resolved_version }}-1_${{ matrix.arch }}.deb
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
